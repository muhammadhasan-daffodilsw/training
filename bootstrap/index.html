<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Quickstart</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h1>Hello, Bootstrap!</h1>
  </div>
  <div class="container">
  <div class="row">
    <!-- Takes 12 cols on mobile, 4 cols (1/3) on desktop -->
    <div class="col-12 col-md-4">Sidebar</div>
    <!-- Takes 12 cols on mobile, 8 cols (2/3) on desktop -->
    <div class="col-12 col-md-8">Main Content</div>
  </div>
</div>
<button type="button" class="btn btn-primary">Primary Action</button>
<button type="button" class="btn btn-outline-secondary">Secondary Action</button>

  <!-- Bootstrap JS (for dropdowns, modals, toggles) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
